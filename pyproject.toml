[project]
name = "research-agent"
version = "0.1.0"
description = "Local-first research agent with Local RAG and Web Research workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "janus>=2.0.0",
    "pypdf>=4.0.0",
    "trafilatura>=1.9.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
